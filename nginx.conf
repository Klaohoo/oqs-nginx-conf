worker_processes auto;

env OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf;
env OSSL_PROVIDER_PATH=/usr/local/lib/ossl-modules;

events {
    worker_connections 1024;
}

http {
    log_format tls '$remote_addr - $host:$server_port [$time_local] '
                   '"$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher curve=$ssl_curve';

    access_log /var/log/nginx/tls-access.log tls;
    error_log  /var/log/nginx/tls-error.log info;

    sendfile on;
    keepalive_timeout 65;

    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;

    #
    # 1) Classical KEX + RSA cert
    #
    server {
        listen 4433 ssl;
        server_name classical-rsa.local;

        ssl_certificate     /etc/nginx/certs/rsa/server-rsa.crt;
        ssl_certificate_key /etc/nginx/certs/rsa/server-rsa.key;

        ssl_conf_command Groups X25519:secp256r1:secp384r1;
        ssl_conf_command SignatureAlgorithms rsa_pss_rsae_sha256:rsa_pkcs1_sha256;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 classical KEX + RSA cert\n";
        }
    }

    #
    # 2) Classical KEX + ECDSA cert
    #
    server {
        listen 4434 ssl;
        server_name classical-ecdsa.local;

        ssl_certificate     /etc/nginx/certs/ecdsa/server-ecdsa.crt;
        ssl_certificate_key /etc/nginx/certs/ecdsa/server-ecdsa.key;

        ssl_conf_command Groups X25519:secp256r1:secp384r1;
        ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 classical KEX + ECDSA cert\n";
        }
    }

    #
    # 3) Hybrid KEX + RSA cert
    #
    server {
        listen 4435 ssl;
        server_name hybrid-rsa.local;

        ssl_certificate     /etc/nginx/certs/rsa/server-rsa.crt;
        ssl_certificate_key /etc/nginx/certs/rsa/server-rsa.key;

        # Replace with exact names from your openssl list -tls-groups output
        ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768;
        ssl_conf_command SignatureAlgorithms rsa_pss_rsae_sha256:rsa_pkcs1_sha256;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 hybrid KEX + RSA cert\n";
        }
    }

    #
    # 4) Hybrid KEX + ECDSA cert
    #
    server {
        listen 4436 ssl;
        server_name hybrid-ecdsa.local;

        ssl_certificate     /etc/nginx/certs/ecdsa/server-ecdsa.crt;
        ssl_certificate_key /etc/nginx/certs/ecdsa/server-ecdsa.key;

        # Replace with exact names from your build
        ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768;
        ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 hybrid KEX + ECDSA cert\n";
        }
    }

    #
    # 5) PQC-only KEX + RSA cert
    #
    server {
        listen 4437 ssl;
        server_name pqc-rsa.local;

        ssl_certificate     /etc/nginx/certs/rsa/server-rsa.crt;
        ssl_certificate_key /etc/nginx/certs/rsa/server-rsa.key;

        # Replace with exact PQ KEM group name from your build
        ssl_conf_command Groups MLKEM768;
        ssl_conf_command SignatureAlgorithms rsa_pss_rsae_sha256:rsa_pkcs1_sha256;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 PQC-only KEX + RSA cert\n";
        }
    }

    #
    # 6) PQC-only KEX + ECDSA cert
    #
    server {
        listen 4438 ssl;
        server_name pqc-ecdsa.local;

        ssl_certificate     /etc/nginx/certs/ecdsa/server-ecdsa.crt;
        ssl_certificate_key /etc/nginx/certs/ecdsa/server-ecdsa.key;

        # Replace with exact PQ KEM group name from your build
        ssl_conf_command Groups MLKEM768;
        ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256:ecdsa_secp384r1_sha384;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 PQC-only KEX + ECDSA cert\n";
        }
    }

    #
    # 7) Hybrid KEX + PQ certificate
    #    Only enable if your stack actually supports PQ/hybrid certs in nginx.
    #
    server {
        listen 4439 ssl;
        server_name hybrid-pqcert.local;

        ssl_certificate     /etc/nginx/certs/pq/server-pq.crt;
        ssl_certificate_key /etc/nginx/certs/pq/server-pq.key;

        ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768;

        # Replace with your actual supported PQ/hybrid signature algorithm names
        # Examples here are placeholders and may differ in your build.
        ssl_conf_command SignatureAlgorithms mldsa65;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 hybrid KEX + PQ cert\n";
        }
    }

    #
    # 8) PQC-only KEX + PQ certificate
    #    Only enable if your stack supports it.
    #
    server {
        listen 4440 ssl;
        server_name pqc-pqcert.local;

        ssl_certificate     /etc/nginx/certs/pq/server-pq.crt;
        ssl_certificate_key /etc/nginx/certs/pq/server-pq.key;

        ssl_conf_command Groups MLKEM768;

        # Replace with supported PQ/hybrid signature algorithm names
        ssl_conf_command SignatureAlgorithms mldsa65;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 PQC-only KEX + PQ cert\n";
        }
    }
}
