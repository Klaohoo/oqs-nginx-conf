worker_processes auto;

# Preserve/set the OpenSSL environment so nginx workers can load oqsprovider.
# Adjust these paths for your system.
env OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf;
env OSSL_PROVIDER_PATH=/usr/local/lib/ossl-modules;

events {
    worker_connections 1024;
}

http {
    log_format tls '$remote_addr - $host:$server_port [$time_local] '
                   '"$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher curve=$ssl_curve';

    access_log /var/log/nginx/tls-access.log tls;
    error_log  /var/log/nginx/tls-error.log info;

    sendfile on;
    keepalive_timeout 65;

    # Common TLS settings
    ssl_protocols TLSv1.3;
    ssl_certificate     /etc/nginx/certs/test.crt;
    ssl_certificate_key /etc/nginx/certs/test.key;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 10m;

    # TLS 1.3 cipher suites
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;

    # 1) Classical-only TLS 1.3
    server {
        listen 4433 ssl;
        server_name classical.local;

        # Classical groups only
        ssl_conf_command Groups X25519:secp256r1:secp384r1;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 classical test endpoint\n";
        }
    }

    # 2) Hybrid TLS 1.3
    server {
        listen 4434 ssl;
        server_name hybrid.local;

        # Replace with the exact hybrid group names from:
        # openssl list -tls-groups -provider default -provider oqsprovider
        #
        # Common examples on newer builds:
        #   X25519MLKEM768
        #   SecP256r1MLKEM768
        ssl_conf_command Groups X25519MLKEM768:SecP256r1MLKEM768;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 hybrid test endpoint\n";
        }
    }

    # 3) PQC-only TLS 1.3
    server {
        listen 4435 ssl;
        server_name pqc.local;

        # Replace with the exact PQC-only group names from your build.
        # Common examples on newer builds:
        #   MLKEM512
        #   MLKEM768
        #   MLKEM1024
        ssl_conf_command Groups MLKEM768;

        location / {
            default_type text/plain;
            return 200 "TLS 1.3 PQC-only test endpoint\n";
        }
    }

    # Optional: if you also want to constrain certificate signature algorithms,
    # add one of these per server block after confirming support in your build.
    #
    # Classical example:
    # ssl_conf_command SignatureAlgorithms rsa_pss_rsae_sha256:ecdsa_secp256r1_sha256;
    #
    # PQ/hybrid cert signatures depend heavily on your OpenSSL/oqsprovider build
    # and client support, so leave them unset unless you specifically need that.
}
