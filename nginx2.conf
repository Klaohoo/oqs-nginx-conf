worker_processes auto;

env OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf;
env OSSL_PROVIDER_PATH=/usr/local/lib/ossl-modules;

events {
    worker_connections 1024;
}

http {
    log_format tls '$remote_addr - $host:$server_port [$time_local] '
                   '"$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher curve=$ssl_curve';

    access_log /var/log/nginx/tls-access.log tls;
    error_log  /var/log/nginx/tls-error.log info;

    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;

    # 1) RSA cert + classical KEX
    server {
        listen 4433 ssl;
        server_name rsa-classical.local;

        ssl_certificate     /etc/nginx/certs/rsa/server-rsa.crt;
        ssl_certificate_key /etc/nginx/certs/rsa/server-rsa.key;

        ssl_conf_command Groups X25519;

        location / {
            default_type text/plain;
            return 200 "RSA cert + classical KEX\n";
        }
    }

    # 2) RSA cert + hybrid KEX
    server {
        listen 4434 ssl;
        server_name rsa-hybrid.local;

        ssl_certificate     /etc/nginx/certs/rsa/server-rsa.crt;
        ssl_certificate_key /etc/nginx/certs/rsa/server-rsa.key;

        ssl_conf_command Groups X25519MLKEM768;

        location / {
            default_type text/plain;
            return 200 "RSA cert + hybrid KEX\n";
        }
    }

    # 3) ECDSA cert + classical KEX
    server {
        listen 4435 ssl;
        server_name ecdsa-classical.local;

        ssl_certificate     /etc/nginx/certs/ecdsa/server-ecdsa.crt;
        ssl_certificate_key /etc/nginx/certs/ecdsa/server-ecdsa.key;

        ssl_conf_command Groups X25519;

        location / {
            default_type text/plain;
            return 200 "ECDSA cert + classical KEX\n";
        }
    }

    # 4) ECDSA cert + hybrid KEX
    server {
        listen 4436 ssl;
        server_name ecdsa-hybrid.local;

        ssl_certificate     /etc/nginx/certs/ecdsa/server-ecdsa.crt;
        ssl_certificate_key /etc/nginx/certs/ecdsa/server-ecdsa.key;

        ssl_conf_command Groups X25519MLKEM768;

        location / {
            default_type text/plain;
            return 200 "ECDSA cert + hybrid KEX\n";
        }
    }

    # 5) PQ cert + classical KEX
    server {
        listen 4437 ssl;
        server_name pq-classical.local;

        ssl_certificate     /etc/nginx/certs/pq/server-pq.crt;
        ssl_certificate_key /etc/nginx/certs/pq/server-pq.key;

        ssl_conf_command Groups X25519;

        location / {
            default_type text/plain;
            return 200 "PQ cert + classical KEX\n";
        }
    }

    # 6) PQ cert + hybrid KEX
    server {
        listen 4438 ssl;
        server_name pq-hybrid.local;

        ssl_certificate     /etc/nginx/certs/pq/server-pq.crt;
        ssl_certificate_key /etc/nginx/certs/pq/server-pq.key;

        ssl_conf_command Groups X25519MLKEM768;

        location / {
            default_type text/plain;
            return 200 "PQ cert + hybrid KEX\n";
        }
    }
}
